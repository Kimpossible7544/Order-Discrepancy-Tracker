<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Entry</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #161f30;
    --border: #232d40; --border-hi: #33415a;
    --text: #e8ecf3; --text-dim: #8b96ac; --text-faint: #5b6478;
    --teal: #2dd4bf; --amber: #f5a623; --red: #f0574a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column; height: 100vh;
    padding: 10px 12px 8px;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-shrink: 0;
  }
  .step-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border-hi); }
  .dot.active { background: var(--teal); }
  .dot.done { background: var(--text-faint); }

  .body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    min-height: 0; overflow-y: auto;
  }
  .question { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .options { display: flex; flex-direction: column; gap: 5px; }
  .opt {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 12px; text-align: left;
    cursor: pointer; transition: all 0.1s; display: flex; align-items: center; gap: 8px;
  }
  .opt:hover { border-color: var(--teal); background: var(--panel-2); }
  .opt.selected { border-color: var(--teal); background: rgba(45,212,191,0.1); color: var(--teal); }
  .opt.kb { border-color: var(--teal); background: var(--panel-2); }
  .opt .key {
    font-family: Consolas, monospace; font-size: 10px; color: var(--text-faint);
    border: 1px solid var(--border-hi); border-radius: 4px; padding: 0 4px; min-width: 16px; text-align: center;
  }

  input[type=text], input[type=date], input[type=number] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 12px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--teal); }
  input.matched { border-color: var(--teal); background: rgba(45,212,191,0.08); }

  .ac-wrap { position: relative; }
  .ac-list {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 3px;
    background: var(--panel-2); border: 1px solid var(--border-hi);
    border-radius: 6px; max-height: 180px; overflow-y: auto; z-index: 10;
  }
  .ac-item {
    padding: 6px 10px; font-size: 11.5px; cursor: pointer; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.hi { background: rgba(45,212,191,0.12); color: var(--teal); }
  .ac-more { padding: 5px 10px; font-size: 10px; color: var(--text-faint); }
  .ac-tag, .hint {
    font-size: 9.5px; color: var(--text-faint); margin-top: 4px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .ac-tag { color: var(--teal); }

  .nav {
    display: flex; gap: 6px; margin-top: 8px; flex-shrink: 0;
  }
  button {
    flex: 1; border: none; border-radius: 6px; padding: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-back { background: var(--panel-2); border: 1px solid var(--border-hi); color: var(--text); flex: 0 0 60px; }
  .btn-next { background: var(--teal); color: #06201c; }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-skip { background: none; color: var(--text-faint); flex: 0 0 50px; font-weight: 500; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; font-size: 10px; color: var(--text-faint); flex-shrink: 0;
  }
  .footer div { display: flex; gap: 10px; }
  .footer button { flex: none; background: none; color: var(--text-faint); padding: 3px 6px; font-size: 10px; font-weight: 500; text-decoration: underline; }
  .footer button:hover { color: var(--teal); }

  .done-screen { text-align: center; }
  .done-screen .check { font-size: 28px; color: var(--teal); margin-bottom: 4px; }
  .done-screen p { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; }
</style>
</head>

/* NORMALIZE-START
   Standard exam names - same rules used to clean up the Excel log (2026-11-05):
   typos/spacing/capitals, Bilat -> Bilateral, add "Views", Hip and Pelvis -> Hips and Pelvis,
   Body part -> Side -> Number, Left before Right in combined orders,
   Foot Ankle -> Foot and Ankle, Lumbar flexion/extension merged, Hand and Wrist combined exams. */
const NZ_TYPOS = [
  [/\bVIews\b/gi, 'Views'], [/\bRIght\b/gi, 'Right'], [/\bRght\b/gi, 'Right'],
  [/\bBilteral\b/gi, 'Bilateral'], [/\bBlateral\b/gi, 'Bilateral'], [/\bBilaterai\b/gi, 'Bilateral'],
  [/\bBilat\b/gi, 'Bilateral'], [/\bPelvls\b/gi, 'Pelvis'], [/\bStandin\b/gi, 'Standing'],
  [/\bWrsit\b/gi, 'Wrist'], [/\bShould\b(?!er)/gi, 'Shoulder'],
];
const NZ_LOWER = new Set(['and', 'with', 'x2', 'or', 'to', 'of', 'in', 'the']);
const NZ_UPPER = new Set(['DX', 'PA', 'KUB', 'AP', 'CT', 'AC', 'VA', 'VP', 'PICC', 'AM', 'OARM', 'EOS']);
const NZ_COUNT = '\\d+(?:-\\d+)?\\+?';

function nzTitle(word) {
  if (word.includes('§')) return word.split('§').map(nzTitle).join('§');
  const core = word.replace(/^,+|,+$/g, '');
  if (NZ_LOWER.has(core.toLowerCase())) return word.toLowerCase();
  if (NZ_UPPER.has(core.toUpperCase())) return word.toUpperCase();
  if (/^[\d\-+]+$/.test(core)) return word;
  return word.slice(0, 1).toUpperCase() + word.slice(1).toLowerCase();
}

function nzSegment(p) {
  p = p.trim();
  if (!p) return p;
  for (const [re, rep] of NZ_TYPOS) p = p.replace(re, rep);
  p = p.split(' ').filter(Boolean).map(nzTitle).join(' ');
  p = p.replace(/\bHip and Pelvis\b/g, 'Hips and Pelvis');
  p = p.replace(/\bFoot Ankle\b/g, 'Foot and Ankle');
  p = p.replace(/^Lumbar Views\b/, 'Lumbar Spine');
  p = p.replace(/^Lumbar Spine (Flex§Ext|Flexion and Extension|Flexion Extension)( 2)?( Views?)?$/i,
                'Lumbar Spine Flexion Extension 2 Views');
  let m = p.match(new RegExp('^(Left|Right|Bilateral) ([A-Za-z][A-Za-z ]*?)( ' + NZ_COUNT + '.*)?$'));
  if (m) p = `${m[2]} ${m[1]}${m[3] || ''}`;
  m = p.match(new RegExp('^(.*? )(' + NZ_COUNT + ')(?: Views?)?( x2)?$'));
  if (m) p = `${m[1]}${m[2]} ${m[2] === '1' ? 'View' : 'Views'}${m[3] || ''}`;
  return p;
}

function nzSide(seg) {
  for (const s of ['Left', 'Right', 'Bilateral']) if (new RegExp(`\\b${s}\\b`).test(seg)) return s;
  return null;
}

function normalizeExam(name) {
  if (name === null || name === undefined) return name;
  let s = String(name).replace(/\s+/g, ' ').trim();
  if (!s) return s;
  s = s.replace(/\bW\//gi, 'W§').replace(/\bFlex\/Ext\b/gi, 'Flex§Ext').replace(/^Hand\/Wrist\b/i, 'Hand and Wrist');
  const segs = s.split('/').filter(x => x.trim()).map(nzSegment);
  // Left before Right; Bilateral / no-side exams stay where they were typed
  const slots = segs.map((g, i) => ['Left', 'Right'].includes(nzSide(g)) ? i : -1).filter(i => i >= 0);
  const lr = slots.map(i => segs[i]);
  const ordered = lr.filter(g => nzSide(g) === 'Left').concat(lr.filter(g => nzSide(g) === 'Right'));
  slots.forEach((i, k) => { segs[i] = ordered[k]; });
  let out = segs.join('/').replace(/W§/g, 'W/').replace(/Flex§Ext/g, 'Flex/Ext');
  out = out.replace(new RegExp('^Hand (Left|Right|Bilateral) (' + NZ_COUNT + ') Views and Wrist \\1 \\2 Views$'),
                    'Hand and Wrist $1 $2 Views');
  return out;
}
/* NORMALIZE-END */

function formatExamName(raw) {
  return normalizeExam(raw.replace(/^(DX|FL)\s+/i, ''));
}

function acCandidates(typed) {
  const t = typed.trim().toLowerCase();
  if (t.length < 3) return [];
  const words = t.split(/\s+/).filter(Boolean);
  const results = [];
  for (const exam of EXAM_LIST) {
    const tokens = exam.toLowerCase().split(/\s+/);
    let idx = 0;
    let ok = true;
    for (const w of words) {
      let found = -1;
      for (let i = idx; i < tokens.length; i++) {
        if (tokens[i].startsWith(w) || w.startsWith(tokens[i])) { found = i; break; }
      }
      if (found === -1) { ok = false; break; }
      idx = found + 1;
    }
    if (ok) results.push(exam);
  }
  return results;
}

  // update doesn't inherit whatever bad number was stuck in localStorage.
  // Runs once ever (per browser), tracked by the flag below.
  const FLAG = 'discrepancy-id-counter-baseline-2026-09-22';
  if (!localStorage.getItem(FLAG)) {
    localStorage.setItem('discrepancy-id-counter', '333'); // next call returns DE-000334
    localStorage.setItem(FLAG, '1');
  }
}

function nextEntryID() {
  let counter = parseInt(localStorage.getItem('discrepancy-id-counter') || '333', 10);
  counter += 1;
  localStorage.setItem('discrepancy-id-counter', String(counter));
  // e.g. DE-000042 - sequential, human-readable, guaranteed unique per device
  return 'DE-' + String(counter).padStart(6, '0');
}

function peekNextID() {
  const counter = parseInt(localStorage.getItem('discrepancy-id-counter') || '333', 10);
  return 'DE-' + String(counter + 1).padStart(6, '0');
}

function setNextID() {
  const current = peekNextID();
  const input = prompt(`Next entry will be numbered ${current}.\nEnter the number you want the NEXT entry to be (digits only, e.g. 334):`, parseInt(current.slice(3), 10));
  if (input === null) return; // cancelled
  const n = parseInt(input, 10);
  if (isNaN(n) || n < 1) {
    alert('Enter a whole number, e.g. 334.');
    return;
  }
  localStorage.setItem('discrepancy-id-counter', String(n - 1));
  updateCount();
  alert(`Next entry will now be DE-${String(n).padStart(6,'0')}.`);
}

function loadData() {
  try { entries = JSON.parse(localStorage.getItem('discrepancy-entries') || '[]'); } catch(e) { entries = []; }
  // Backfill IDs for any entries saved before ID tracking existed
  let migrated = false;
  entries.forEach(e => {
    if (!e.entryID) {
      e.entryID = nextEntryID();
      migrated = true;
    }
  });
  if (migrated) saveData();
  updateCount();
}
function saveData() {
  localStorage.setItem('discrepancy-entries', JSON.stringify(entries));
  updateCount();
}
function updateCount() {
  document.getElementById('count').textContent = entries.length + ' logged · Next: ' + peekNextID();
}

function resolveFields() {
  if (!current.errorType) {
    return [ERROR_TYPE_STEP];
  }
  const base = (current.errorType === 'Order Error' ? FIELDS_ORDER_ERROR : FIELDS_SCHEDULING_ERROR).slice();
  base.unshift(ERROR_TYPE_STEP);

  if (current.errorType === 'Order Error' && current.category === 'Other') {
    const idx = base.findIndex(f => f.key === 'category');
    base.splice(idx+1, 0, { key: 'categoryDetail', label: 'Category detail', type: 'text' });
  }

  if (current.errorType === 'Scheduling Error' && current.schedReason === 'Other') {
    const idx = base.findIndex(f => f.key === 'schedReason');
    base.splice(idx+1, 0, { key: 'schedReasonDetail', label: 'Scheduling reason detail', type: 'text' });
  }

  base.push({ key: 'time', label: 'Resolution time (min)', type: 'number', optional: true });
  base.push({ key: 'notes', label: 'Notes', type: 'text', optional: true });
  return base;
}

function start() {
  current = { date: new Date().toISOString().slice(0,10) };
  step = 0;
  activeFields = resolveFields();
  render();
}

const escAttr = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const isExamField = key => key === 'order' || key === 'corrected';

function render() {
  activeFields = resolveFields();
  if (step >= activeFields.length) { renderDone(); return; }
  const f = activeFields[step];
  document.getElementById('stepLabel').textContent = `Step ${step+1} of ${activeFields.length}`;
  renderDots();

  const body = document.getElementById('body');
  let html = `<p class="question">${f.label}${f.optional ? ' <span style="color:var(--text-faint);font-weight:400;">(optional)</span>' : ''}</p>`;

  if (f.type === 'choice') {
    const selIdx = f.options.indexOf(current[f.key]);
    choiceHi = selIdx >= 0 ? selIdx : 0;
    html += '<div class="options">';
    f.options.forEach((o, i) => {
      const sel = current[f.key] === o ? ' selected' : '';
      const kb = i === choiceHi ? ' kb' : '';
      const key = i < 9 ? String(i + 1) : (i === 9 ? '0' : '↓');
      html += `<button class="opt${sel}${kb}" data-i="${i}" tabindex="-1" onclick="choose('${f.key}', '${o.replace(/'/g,"\\'")}')"><span class="key">${key}</span>${o}</button>`;
    });
    html += '</div>';
  } else if (f.type === 'number') {
    html += `<input type="number" id="inp" value="${escAttr(current[f.key])}" oninput="typeVal('${f.key}', this.value)">`;
  } else if (isExamField(f.key)) {
    html += `<div class="ac-wrap">
      <input type="text" id="inp" value="${escAttr(current[f.key])}" placeholder="Type a few letters of each word" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div id="acList" class="ac-list" style="display:none;"></div>
    </div>
    <div class="hint" id="acTag">↑↓ pick · Enter/Tab accept · "/" for a 2nd exam · Enter again = Next</div>`;
  } else if (f.key === 'notes') {
    html += `<input type="text" id="inp" value="${escAttr(current[f.key])}" placeholder="Type here" autocomplete="off" spellcheck="true">
    <div class="hint">Shorthand: ${Object.keys(NOTE_SHORTHAND).join(' · ')}</div>`;
  } else {
    html += `<input type="text" id="inp" value="${escAttr(current[f.key])}" oninput="typeVal('${f.key}', this.value)" placeholder="Type here">`;
  }
  body.innerHTML = html;
  const inp = document.getElementById('inp');
  if (inp) {
    inp.focus();
    inp.setSelectionRange && inp.type === 'text' && inp.setSelectionRange(inp.value.length, inp.value.length);
    if (isExamField(f.key)) {
      inp.addEventListener('input', () => handleExamInput(f.key, inp));
      inp.addEventListener('keydown', e => examKeydown(e, f.key, inp));
    } else if (f.key === 'notes') {
      inp.addEventListener('input', e => notesInput(e, inp));
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === 'Tab') {
          expandTrailingCode(inp);
          current.notes = inp.value;
          if (e.key === 'Enter') { e.preventDefault(); next(); }
        }
      });
    } else {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
    }
  }

  renderNav(f);
}

/* ---------- Exam type-ahead (works on the exam after the last "/") ---------- */
let acHiIndex = -1;
let acShown = [];

function examSegment(value) {
  const i = value.lastIndexOf('/');
  return { head: i >= 0 ? value.slice(0, i + 1) : '', seg: i >= 0 ? value.slice(i + 1) : value };
}

function handleExamInput(key, inp) {
  current[key] = inp.value;
  inp.classList.remove('matched');
  const list = document.getElementById('acList');
  const { seg } = examSegment(inp.value);
  const all = acCandidates(seg);
  acShown = all.slice(0, 8);
  acHiIndex = acShown.length ? 0 : -1;
  if (!acShown.length) { list.style.display = 'none'; list.innerHTML = ''; return; }
  list.innerHTML = acShown.map((c, i) =>
    `<div class="ac-item${i === 0 ? ' hi' : ''}" onmousedown="event.preventDefault(); pickExam('${key}', ${i})">${formatExamName(c)}</div>`
  ).join('') + (all.length > 8 ? `<div class="ac-more">+${all.length - 8} more - keep typing to narrow</div>` : '');
  list.style.display = 'block';
}

function moveAcHighlight(delta) {
  if (!acShown.length) return;
  acHiIndex = (acHiIndex + delta + acShown.length) % acShown.length;
  document.querySelectorAll('#acList .ac-item').forEach((el, i) => {
    el.classList.toggle('hi', i === acHiIndex);
    if (i === acHiIndex) el.scrollIntoView({ block: 'nearest' });
  });
}

function closeAc() {
  const list = document.getElementById('acList');
  if (list) { list.style.display = 'none'; list.innerHTML = ''; }
  acShown = []; acHiIndex = -1;
}

function pickExam(key, idx) {
  const raw = acShown[idx];
  if (raw === undefined) return;
  const inp = document.getElementById('inp');
  const { head } = examSegment(inp.value);
  inp.value = head + formatExamName(raw);
  current[key] = inp.value;
  inp.classList.add('matched');
  closeAc();
  inp.focus();
}

function examKeydown(e, key, inp) {
  const open = acShown.length > 0;
  if (e.key === 'ArrowDown' && open) { e.preventDefault(); moveAcHighlight(1); }
  else if (e.key === 'ArrowUp' && open) { e.preventDefault(); moveAcHighlight(-1); }
  else if ((e.key === 'Enter' || e.key === 'Tab') && open) { e.preventDefault(); pickExam(key, acHiIndex); }
  else if (e.key === 'Enter') { e.preventDefault(); next(); }
  else if (e.key === 'Escape' && open) { e.preventDefault(); e.stopPropagation(); closeAc(); }
}

/* ---------- Notes shorthand ---------- */
function expandTrailingCode(inp, keepChars = 0) {
  // keepChars = how many just-typed separator characters sit after the code
  const caret = inp.selectionStart ?? inp.value.length;
  const before = inp.value.slice(0, caret - keepChars);
  const m = before.match(/(^|[\s(\-])([A-Za-z0-9]+)$/);
  if (!m) return false;
  const code = m[2].toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(NOTE_SHORTHAND, code)) return false;
  const start = before.length - m[2].length;
  const expansion = NOTE_SHORTHAND[code];
  inp.value = inp.value.slice(0, start) + expansion + inp.value.slice(caret - keepChars);
  const pos = start + expansion.length + keepChars;
  inp.setSelectionRange(pos, pos);
  return true;
}

function notesInput(e, inp) {
  if (e.inputType === 'insertText' && e.data && /^[\s.,;:!?)]$/.test(e.data)) expandTrailingCode(inp, 1);
  current.notes = inp.value;
}

/* ---------- Choice steps by keyboard ---------- */
function choiceKeydown(e) {
  const f = activeFields[step];
  if (!f || f.type !== 'choice') return false;
  const n = f.options.length;
  if (/^[0-9]$/.test(e.key)) {
    const idx = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
    if (idx < n) { e.preventDefault(); choose(f.key, f.options[idx]); }
    return true;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    choiceHi = (choiceHi + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
    document.querySelectorAll('.opt').forEach((el, i) => el.classList.toggle('kb', i === choiceHi));
    return true;
  }
  if (e.key === 'Enter') { e.preventDefault(); choose(f.key, f.options[choiceHi]); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  // Text boxes handle their own keys; only Esc (= Back) falls through from them
  if (e.target.tagName === 'INPUT' && e.key !== 'Escape') return;
  if (step >= activeFields.length) {                       // Done screen
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    else if (e.key === 'Escape') { e.preventDefault(); step = activeFields.length - 1; render(); }
    return;
  }
  if (choiceKeydown(e)) return;
  if (e.key === 'Escape' && step > 0) { e.preventDefault(); back(); }
});

function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = activeFields.map((_, i) =>
    `<div class="dot ${i===step?'active':i<step?'done':''}"></div>`).join('');
}

function choose(key, val) {
  current[key] = val;
  next();
}
function typeVal(key, val) {
  current[key] = val;
}

function renderNav(f) {
  const nav = document.getElementById('nav');
  const canBack = step > 0;
  const canSkip = f.optional;
  const isChoice = f.type === 'choice';
  nav.innerHTML = `
    ${canBack ? '<button class="btn-back" tabindex="-1" onclick="back()">Back</button>' : ''}
    ${canSkip ? '<button class="btn-skip" tabindex="-1" onclick="skip()">Skip</button>' : ''}
    ${isChoice ? '' : '<button class="btn-next" tabindex="-1" onclick="next()">Next</button>'}
  `;
}

function next() {
  const f = activeFields[step];
  const inp = document.getElementById('inp');
  if (inp && f.type !== 'choice') {
    if (f.key === 'notes') expandTrailingCode(inp);
    current[f.key] = inp.value;
  }
  // Auto-clean exam names to the standard format ("Same" stays "Same")
  if (isExamField(f.key) && current[f.key] && current[f.key].trim().toLowerCase() !== 'same') {
    current[f.key] = normalizeExam(current[f.key]);
  } else if (isExamField(f.key) && current[f.key]) {
    current[f.key] = 'Same';
  }
  if (!f.optional && f.type !== 'choice' && !current[f.key] && f.key !== 'date') {
    alert('Enter a value or use Skip if optional.');
    return;
  }
  closeAc();
  step++;
  render();
}
function back() { closeAc(); step--; render(); }
function skip() { closeAc(); step++; render(); }

function renderDone() {
  document.getElementById('stepLabel').textContent = 'Complete';
  document.getElementById('dots').innerHTML = '';
  const body = document.getElementById('body');
  const h = s => escAttr(s || '—');
  const summary = current.errorType === 'Order Error'
    ? `<b>${h(current.order)}</b> → <b>${h(current.corrected)}</b><br>${h(current.site)}`
    : `<b>${h(current.origLocation)}</b> → <b>${h(current.corrLocation)}</b><br>${h(current.schedReason || 'Scheduling Error')} · ${h(current.site)}`;
  body.innerHTML = `
    <div class="done-screen">
      <div class="check">✓</div>
      <p>${summary}</p>
      <button class="btn-next" style="width:100%;" onclick="save()">Save entry (Enter)</button>
    </div>`;
  document.getElementById('nav').innerHTML = `<button class="btn-back" onclick="step=activeFields.length-1;render()">Edit (Esc)</button>`;
}

function save() {
  const finalEntry = { ...current };
  finalEntry.entryID = nextEntryID();
  if (finalEntry.errorType === 'Order Error') {
    finalEntry.cause = 'Provider Order Error';
    if (finalEntry.categoryDetail) {
      finalEntry.notes = (finalEntry.notes ? finalEntry.notes + ' — ' : '') + finalEntry.categoryDetail;
    }
  } else if (finalEntry.errorType === 'Scheduling Error') {
    finalEntry.cause = 'Scheduling Error';
    finalEntry.category = 'Exam scheduled incorrectly';
    finalEntry.order = finalEntry.origLocation || '';
    finalEntry.corrected = finalEntry.corrLocation || '';
    delete finalEntry.origLocation;
    delete finalEntry.corrLocation;
  }
  delete finalEntry.errorType;
  delete finalEntry.categoryDetail;
  entries.push(finalEntry);
  saveData();
  start();
}

function clearAll() {
  if (!entries.length) return;
  if (!confirm(`Delete all ${entries.length} logged entries? Export CSV first if you haven't already.`)) return;
  entries = [];
  saveData();
}

function exportCSV() {
  const headers = ['EntryID','Date','Site','OrderPlaced','CorrectedTo','Department','Category','ChargeImpact','RootCause','RootCauseDetail','ResolutionTimeMin','Notes','OrderingPhoneNumber','SchedulingIssue','SchedulingIssueDetail'];
  const rows = entries.map(e => [
    e.entryID, e.date, e.site, e.order, e.corrected, e.dept,
    e.category, e.charge, e.cause, e.causeDetail, e.time, e.notes,
    e.phone || e.orderPhone || '', e.schedReason || '', e.schedReasonDetail || ''
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = '﻿' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'quick_entries.csv';
  a.click();
  URL.revokeObjectURL(url);
}

ensureCounterBaseline();
loadData();
start();
</script>
</body>
</html>
