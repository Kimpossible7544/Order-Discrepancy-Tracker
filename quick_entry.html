<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Entry</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #161f30;
    --border: #232d40; --border-hi: #33415a;
    --text: #e8ecf3; --text-dim: #8b96ac; --text-faint: #5b6478;
    --teal: #2dd4bf; --amber: #f5a623; --red: #f0574a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column; height: 100vh;
    padding: 10px 12px 8px;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-shrink: 0;
  }
  .step-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border-hi); }
  .dot.active { background: var(--teal); }
  .dot.done { background: var(--text-faint); }

  .body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    min-height: 0; overflow-y: auto;
  }
  .question { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .options { display: flex; flex-direction: column; gap: 5px; }
  .opt {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 12px; text-align: left;
    cursor: pointer; transition: all 0.1s;
  }
  .opt:hover { border-color: var(--teal); background: var(--panel-2); }
  .opt.selected { border-color: var(--teal); background: rgba(45,212,191,0.1); color: var(--teal); }

  input[type=text], input[type=date], input[type=number] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 12px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--teal); }

  .nav {
    display: flex; gap: 6px; margin-top: 8px; flex-shrink: 0;
  }
  button {
    flex: 1; border: none; border-radius: 6px; padding: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-back { background: var(--panel-2); border: 1px solid var(--border-hi); color: var(--text); flex: 0 0 60px; }
  .btn-next { background: var(--teal); color: #06201c; }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-skip { background: none; color: var(--text-faint); flex: 0 0 50px; font-weight: 500; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; font-size: 10px; color: var(--text-faint); flex-shrink: 0;
  }
  .footer button { flex: none; background: none; color: var(--text-faint); padding: 3px 6px; font-size: 10px; font-weight: 500; text-decoration: underline; }
  .footer button:hover { color: var(--teal); }

  .done-screen { text-align: center; }
  .done-screen .check { font-size: 28px; color: var(--teal); margin-bottom: 4px; }
  .done-screen p { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="step-label" id="stepLabel">Step 1 of 8</span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="nav" id="nav"></div>
  <div class="footer">
    <span id="count">0 logged</span>
    <button onclick="exportCSV()">Export CSV</button>
  </div>
</div>

<script>
const FIELDS = [
  { key: 'date', label: 'Date', type: 'date', default: () => new Date().toISOString().slice(0,10) },
  { key: 'site', label: 'Site', type: 'choice', options: ['Ch2','Go14','SMOP','Go15E','NW','NE','SE','KAKH','Peds','Baldwin','DAHLC'] },
  { key: 'order', label: 'Order as placed', type: 'text' },
  { key: 'corrected', label: 'Corrected to', type: 'text' },
  { key: 'dept', label: 'Ordering department', type: 'text', optional: true },
  { key: 'category', label: 'Discrepancy category', type: 'choice', options: [
    'Order name/view count mismatch','Order views vs. protocol mismatch','Incorrect order (wrong exam type)',
    'Prerequisite not met','Exam scheduled incorrectly','Other'] },
  { key: 'charge', label: 'Charge impact', type: 'choice', options: ['Yes','No','Unknown'] },
  { key: 'cause', label: 'Root cause', type: 'choice', options: ['Provider Order Error','Scheduling Error','Other'] },
];

let entries = [];
let current = {};
let step = 0;
let activeFields = FIELDS;

function loadData() {
  try { entries = JSON.parse(localStorage.getItem('discrepancy-entries') || '[]'); } catch(e) { entries = []; }
  updateCount();
}
function saveData() {
  localStorage.setItem('discrepancy-entries', JSON.stringify(entries));
  updateCount();
}
function updateCount() {
  document.getElementById('count').textContent = entries.length + ' logged';
}

function resolveFields() {
  // insert cause detail step if cause is Other
  const base = FIELDS.slice();
  if (current.cause === 'Other') {
    const idx = base.findIndex(f => f.key === 'cause');
    base.splice(idx+1, 0, { key: 'causeDetail', label: 'Root cause detail', type: 'text' });
  }
  base.push({ key: 'time', label: 'Resolution time (min)', type: 'number', optional: true });
  base.push({ key: 'notes', label: 'Notes', type: 'text', optional: true });
  return base;
}

function start() {
  current = {};
  step = 0;
  activeFields = resolveFields();
  render();
}

function render() {
  activeFields = resolveFields();
  if (step >= activeFields.length) { renderDone(); return; }
  const f = activeFields[step];
  document.getElementById('stepLabel').textContent = `Step ${step+1} of ${activeFields.length}`;
  renderDots();

  const body = document.getElementById('body');
  let html = `<p class="question">${f.label}${f.optional ? ' <span style="color:var(--text-faint);font-weight:400;">(optional)</span>' : ''}</p>`;

  if (f.type === 'choice') {
    html += '<div class="options">';
    f.options.forEach(o => {
      const sel = current[f.key] === o ? ' selected' : '';
      html += `<button class="opt${sel}" onclick="choose('${f.key}', '${o.replace(/'/g,"\\'")}')">${o}</button>`;
    });
    html += '</div>';
  } else if (f.type === 'date') {
    const val = current[f.key] || f.default();
    html += `<input type="date" id="inp" value="${val}" oninput="typeVal('${f.key}', this.value)">`;
    if (!current[f.key]) current[f.key] = val;
  } else if (f.type === 'number') {
    html += `<input type="number" id="inp" value="${current[f.key]||''}" oninput="typeVal('${f.key}', this.value)">`;
  } else {
    html += `<input type="text" id="inp" value="${current[f.key]||''}" oninput="typeVal('${f.key}', this.value)" placeholder="Type here">`;
  }
  body.innerHTML = html;
  const inp = document.getElementById('inp');
  if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') next(); }); }

  renderNav(f);
}

function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = activeFields.map((_, i) =>
    `<div class="dot ${i===step?'active':i<step?'done':''}"></div>`).join('');
}

function choose(key, val) {
  current[key] = val;
  next();
}
function typeVal(key, val) {
  current[key] = val;
}

function renderNav(f) {
  const nav = document.getElementById('nav');
  const canBack = step > 0;
  const canSkip = f.optional;
  const isChoice = f.type === 'choice';
  nav.innerHTML = `
    ${canBack ? '<button class="btn-back" onclick="back()">Back</button>' : ''}
    ${canSkip ? '<button class="btn-skip" onclick="skip()">Skip</button>' : ''}
    ${isChoice ? '' : '<button class="btn-next" onclick="next()">Next</button>'}
  `;
}

function next() {
  const f = activeFields[step];
  if (!f.optional && f.type !== 'choice' && !current[f.key] && f.key !== 'date') {
    alert('Enter a value or use Skip if optional.');
    return;
  }
  step++;
  render();
}
function back() { step--; render(); }
function skip() { step++; render(); }

function renderDone() {
  document.getElementById('stepLabel').textContent = 'Complete';
  document.getElementById('dots').innerHTML = '';
  const body = document.getElementById('body');
  body.innerHTML = `
    <div class="done-screen">
      <div class="check">✓</div>
      <p><b>${current.order || '—'}</b> → <b>${current.corrected || '—'}</b><br>${current.site || ''}</p>
      <button class="btn-next" style="width:100%;" onclick="save()">Save entry</button>
    </div>`;
  document.getElementById('nav').innerHTML = `<button class="btn-back" onclick="step=activeFields.length-1;render()">Edit</button>`;
}

function save() {
  entries.push({ ...current });
  saveData();
  start();
}

function exportCSV() {
  const headers = ['Date','Site','OrderPlaced','CorrectedTo','Department','Category','ChargeImpact','RootCause','RootCauseDetail','ResolutionTimeMin','Notes'];
  const rows = entries.map(e => [e.date,e.site,e.order,e.corrected,e.dept,e.category,e.charge,e.cause,e.causeDetail,e.time,e.notes]
    .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'quick_entries.csv';
  a.click();
  URL.revokeObjectURL(url);
}

loadData();
start();
</script>
</body>
</html>
