<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Discrepancy Pattern Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #161f30;
    --border: #232d40;
    --border-hi: #33415a;
    --text: #e8ecf3;
    --text-dim: #8b96ac;
    --text-faint: #5b6478;
    --teal: #2dd4bf;
    --teal-dim: #0f766e;
    --amber: #f5a623;
    --red: #f0574a;
    --blue: #4a90d9;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 28px 48px;
    background: radial-gradient(ellipse at top, #0d1220 0%, var(--bg) 55%);
    color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    color: var(--teal); text-transform: uppercase; margin: 0 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-left: 3px solid var(--teal-dim);
    border-radius: 10px; padding: 16px 18px;
  }
  .stat.warn { border-left-color: var(--amber); }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .stat .value { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--text); }
  .stat .value.small { font-size: 17px; font-family: var(--sans); font-weight: 600; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 24px; margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 18px; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2::before { content: ''; width: 3px; height: 14px; background: var(--teal); border-radius: 2px; }

  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 5px; font-weight: 500; }
  input, select, textarea {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 9px 11px; font-size: 13px; font-family: var(--sans);
    transition: border-color 0.15s;
  }
  input:hover, select:hover { border-color: var(--border-hi); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(45,212,191,0.12); }
  .field { display: flex; flex-direction: column; }

  button {
    background: var(--teal); color: #06201c; border: none; border-radius: 7px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--sans); transition: transform 0.1s, opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: var(--panel-2); border: 1px solid var(--border-hi); color: var(--text);
    font-weight: 500;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border); }
  th {
    color: var(--text-faint); font-weight: 600; text-transform: uppercase;
    font-size: 10px; letter-spacing: 0.05em; font-family: var(--mono);
  }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--panel-2); }
  .yes { color: var(--red); font-weight: 600; }
  .no { color: var(--text-faint); }
  .unk { color: var(--amber); }
  .del {
    color: var(--text-faint); cursor: pointer; background: none; border: none;
    padding: 3px 8px; font-size: 11px; border-radius: 5px; transition: all 0.15s;
  }
  .del:hover { color: var(--red); background: rgba(240,87,74,0.1); }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chart-box { position: relative; height: 230px; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 32px 0; text-align: center; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; }
  .toolbar h2 { margin: 0; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .table-scroll { overflow-x: auto; }
  .source-row { align-items: flex-end; margin-bottom: 0; }
  .source-row .field { flex: 1; min-width: 260px; }
  .status { font-size: 12px; color: var(--text-dim); margin: 12px 0 0; min-height: 16px; }
  .status.ok { color: var(--teal); }
  .status.error { color: var(--red); }

  @media (max-width: 720px) {
    .charts { grid-template-columns: 1fr; }
    body { padding: 20px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

<p class="eyebrow">Radiology IT · Discrepancy tracking</p>
<h1>Order discrepancy pattern dashboard</h1>
<p class="sub">Order/protocol discrepancy log across 11 sites</p>

<div class="panel">
  <h2>Workbook source</h2>
  <div class="row source-row">
    <div class="field">
      <label>Dropbox shared link to Discrepancy_Tracker.xlsm</label>
      <input type="url" id="f-link" placeholder="https://www.dropbox.com/scl/fi/.../Discrepancy_Tracker.xlsm?rlkey=..." spellcheck="false">
    </div>
    <button onclick="loadFromDropbox()">Load from Dropbox</button>
    <button class="secondary file-btn">Open local workbook<input type="file" accept=".xlsm,.xlsx,.xlsb,.xls" onchange="importWorkbookFile(event)"></button>
  </div>
  <p class="status" id="source-status" role="status"></p>
</div>

<div class="stats" id="stats"></div>

<div class="panel">
  <h2>Log a discrepancy</h2>
  <div class="row">
    <div class="field"><label>Date</label><input type="date" id="f-date"></div>
    <div class="field"><label>Site</label>
      <select id="f-site">
        <option value="">Select site</option>
        <option>Ch2</option><option>Go14</option><option>SMOP</option><option>Go15E</option>
        <option>NW</option><option>NE</option><option>SE</option><option>KAKH</option>
        <option>Peds</option><option>Baldwin</option><option>DAHLC</option>
      </select>
    </div>
    <div class="field"><label>Order as placed</label><input type="text" id="f-order" placeholder="e.g. Abdomen" list="order-list"><datalist id="order-list"></datalist></div>
    <div class="field"><label>Corrected to</label><input type="text" id="f-corrected" placeholder="e.g. KUB" list="corrected-list"><datalist id="corrected-list"></datalist></div>
    <div class="field"><label>Ordering department</label><input type="text" id="f-dept" placeholder="optional" list="dept-list"><datalist id="dept-list"></datalist></div>
    <div class="field">
      <label>Discrepancy category</label>
      <select id="f-category">
        <option>Order name/view count mismatch</option>
        <option>Order views vs. protocol mismatch</option>
        <option>Incorrect order (wrong exam type)</option>
        <option>Prerequisite not met</option>
        <option>Exam scheduled incorrectly</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Charge impact</label>
      <select id="f-charge"><option>No</option><option>Yes</option><option>Unknown</option></select>
    </div>
    <div class="field">
      <label>Root cause</label>
      <select id="f-cause" onchange="toggleCauseDetail()">
        <option>Provider Order Error</option>
        <option>Scheduling Error</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field" id="f-cause-detail-wrap" style="display:none;">
      <label>Root cause detail</label>
      <input type="text" id="f-cause-detail" placeholder="Describe the cause">
    </div>
    <div class="field"><label>Resolution time (min)</label><input type="number" id="f-time" placeholder="optional"></div>
  </div>
  <div class="row">
    <div class="field" style="flex:1; min-width:240px;"><label>Notes</label><input type="text" id="f-notes" placeholder="optional"></div>
  </div>
  <button onclick="addEntry()">Add entry</button>
</div>

<div class="panel">
  <div class="toolbar" style="margin-bottom:18px;">
    <h2>Pattern breakdown</h2>
  </div>
  <div class="charts">
    <div><div class="chart-box"><canvas id="chartCategory" role="img" aria-label="Discrepancy count by category"></canvas></div></div>
    <div><div class="chart-box"><canvas id="chartSite" role="img" aria-label="Discrepancy count by site"></canvas></div></div>
    <div><div class="chart-box"><canvas id="chartCharge" role="img" aria-label="Discrepancy count by charge impact"></canvas></div></div>
    <div><div class="chart-box"><canvas id="chartCause" role="img" aria-label="Discrepancy count by root cause"></canvas></div></div>
  </div>
</div>

<div class="panel">
  <div class="toolbar" style="margin-bottom:18px;">
    <h2>Top order patterns</h2>
  </div>
  <div class="chart-box" style="height:260px;"><canvas id="chartPairs" role="img" aria-label="Most frequent order-as-placed to corrected-to pairs"></canvas></div>
</div>

<div class="panel">
  <div class="toolbar" style="margin-bottom:18px;">
    <h2>Entries over time</h2>
  </div>
  <div class="chart-box" style="height:220px;"><canvas id="chartTrend" role="img" aria-label="Number of entries logged per week"></canvas></div>
</div>

<div class="panel">
  <div class="toolbar" style="margin-bottom:18px;">
    <h2>Entries</h2>
    <div style="display:flex; gap:8px;">
      <button class="secondary file-btn">Import CSV<input type="file" accept=".csv" onchange="importCSV(event)"></button>
      <button class="secondary" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>
  <div class="table-scroll" id="tableWrap"></div>
</div>

</div>
<script>
let entries = [];

const LINK_KEY = 'discrepancy-dropbox-link';
const LOG_SHEET = 'Log';

function setSourceStatus(msg, kind) {
  const el = document.getElementById('source-status');
  el.textContent = msg || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

// Dropbox share links serve an HTML preview by default. The dl.dropboxusercontent.com
// host with raw=1 serves the file bytes and allows cross-origin reads.
function toDirectDropboxUrl(raw) {
  const url = new URL(raw.trim());
  if (!/(^|\.)dropbox(usercontent)?\.com$/.test(url.hostname)) {
    throw new Error('That is not a Dropbox link.');
  }
  url.hostname = 'dl.dropboxusercontent.com';
  url.searchParams.delete('dl');
  url.searchParams.delete('st');
  url.searchParams.set('raw', '1');
  return url.toString();
}

async function loadFromDropbox() {
  const link = document.getElementById('f-link').value.trim();
  if (!link) { setSourceStatus('Paste a Dropbox shared link first.', 'error'); return; }
  let direct;
  try { direct = toDirectDropboxUrl(link); }
  catch (err) { setSourceStatus(err.message, 'error'); return; }

  setSourceStatus('Downloading workbook…');
  try {
    const res = await fetch(direct, { cache: 'no-store' });
    if (!res.ok) throw new Error('Dropbox returned ' + res.status);
    const buf = await res.arrayBuffer();
    const count = applyWorkbook(buf);
    localStorage.setItem(LINK_KEY, link);
    setSourceStatus('Loaded ' + count + ' rows from Dropbox at ' + new Date().toLocaleTimeString() + '.', 'ok');
  } catch (err) {
    setSourceStatus('Could not load the workbook (' + err.message + '). The link must be shared as ' +
      '"Anyone with the link — can view". You can also open a local copy instead.', 'error');
  }
}

function importWorkbookFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const count = applyWorkbook(e.target.result);
      setSourceStatus('Loaded ' + count + ' rows from ' + file.name + '.', 'ok');
    } catch (err) {
      setSourceStatus('Could not read ' + file.name + ' (' + err.message + ').', 'error');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// Replaces the entry list with the workbook's Log sheet, which is the source of truth.
function applyWorkbook(data) {
  const book = XLSX.read(data, { type: 'array', cellDates: true });
  const sheetName = book.SheetNames.includes(LOG_SHEET)
    ? LOG_SHEET
    : book.SheetNames.find(n => n.toLowerCase() === LOG_SHEET.toLowerCase());
  if (!sheetName) throw new Error('no "' + LOG_SHEET + '" sheet in the workbook');

  const rows = XLSX.utils.sheet_to_json(book.Sheets[sheetName], { defval: '', blankrows: false });
  const mapped = rows.map(rowToEntry).filter(e => e.site || e.order || e.corrected);
  entries = mapped;
  saveData();
  render();
  return mapped.length;
}

function pick(row, names) {
  for (const key of Object.keys(row)) {
    const norm = key.trim().toLowerCase();
    if (names.some(n => norm === n || norm.startsWith(n))) return row[key];
  }
  return '';
}

function rowToEntry(row) {
  const charge = String(pick(row, ['charge impact', 'charge']) || 'Unknown').trim();
  const rawCause = String(pick(row, ['root cause']) || 'Other').trim();
  const detail = String(pick(row, ['root cause detail']) || '').trim();
  return {
    date: toDateString(pick(row, ['date'])),
    site: String(pick(row, ['site']) || '').trim(),
    order: String(pick(row, ['order as placed', 'order placed', 'order']) || '').trim(),
    corrected: String(pick(row, ['corrected to', 'corrected']) || '').trim(),
    dept: String(pick(row, ['ordering department', 'department', 'dept']) || '').trim(),
    category: String(pick(row, ['discrepancy category', 'category']) || 'Other').trim(),
    charge: ['Yes', 'No', 'Unknown'].includes(charge) ? charge : 'Unknown',
    cause: rawCause || 'Other',
    causeDetail: detail,
    time: String(pick(row, ['resolution time']) ?? '').trim(),
    notes: String(pick(row, ['notes']) || '').trim(),
  };
}

function toDateString(value) {
  if (value instanceof Date && !isNaN(value)) {
    const pad = (n) => String(n).padStart(2, '0');
    return value.getFullYear() + '-' + pad(value.getMonth() + 1) + '-' + pad(value.getDate());
  }
  const text = String(value || '').trim();
  const match = text.match(/^(\d{4}-\d{2}-\d{2})/);
  return match ? match[1] : text;
}

function loadData() {
  try {
    const raw = localStorage.getItem('discrepancy-entries');
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) { entries = []; }
  render();
}

function saveData() {
  try { localStorage.setItem('discrepancy-entries', JSON.stringify(entries)); }
  catch (e) { console.error('Save failed', e); }
}

function toggleCauseDetail() {
  const isOther = document.getElementById('f-cause').value === 'Other';
  document.getElementById('f-cause-detail-wrap').style.display = isOther ? 'flex' : 'none';
}

function addEntry() {
  const date = document.getElementById('f-date').value || new Date().toISOString().slice(0,10);
  const site = document.getElementById('f-site').value;
  const order = document.getElementById('f-order').value.trim();
  const corrected = document.getElementById('f-corrected').value.trim();
  const dept = document.getElementById('f-dept').value.trim();
  const category = document.getElementById('f-category').value;
  const charge = document.getElementById('f-charge').value;
  const cause = document.getElementById('f-cause').value;
  const causeDetail = cause === 'Other' ? document.getElementById('f-cause-detail').value.trim() : '';
  const time = document.getElementById('f-time').value;
  const notes = document.getElementById('f-notes').value.trim();

  if (!site) { alert('Enter a site'); return; }
  if (cause === 'Other' && !causeDetail) { alert('Enter a root cause detail for Other'); return; }

  entries.push({ date, site, order, corrected, dept, category, charge, cause, causeDetail, time, notes });
  saveData();
  ['f-order','f-corrected','f-dept','f-time','f-notes','f-cause-detail'].forEach(id => document.getElementById(id).value = '');
  toggleCauseDetail();
  render();
}

function deleteEntry(idx) {
  entries.splice(idx, 1);
  saveData();
  render();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  renderStats();
  renderTable();
  renderCharts();
  updateDeptList();
  updateExamLists();
}

function updateExamLists() {
  const ordered = [...new Set(entries.map(e => e.order).filter(Boolean))].sort();
  const corrected = [...new Set(entries.map(e => e.corrected).filter(Boolean))].sort();
  document.getElementById('order-list').innerHTML = ordered.map(v => `<option value="${escapeHtml(v)}">`).join('');
  document.getElementById('corrected-list').innerHTML = corrected.map(v => `<option value="${escapeHtml(v)}">`).join('');
}

function updateDeptList() {
  const depts = [...new Set(entries.map(e => e.dept).filter(Boolean))].sort();
  document.getElementById('dept-list').innerHTML = depts.map(d => `<option value="${escapeHtml(d)}">`).join('');
}

function renderStats() {
  const total = entries.length;
  const chargeImpact = entries.filter(e => e.charge === 'Yes').length;
  const chargePct = total ? Math.round((chargeImpact/total)*100) : 0;
  const sites = new Set(entries.map(e => e.site)).size;
  const topCat = topOf(entries.map(e => e.category));

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Total logged</div><div class="value">${total}</div></div>
    <div class="stat warn"><div class="label">Charge-impacting</div><div class="value">${chargeImpact}<span style="font-size:14px;color:var(--text-faint);"> / ${chargePct}%</span></div></div>
    <div class="stat"><div class="label">Sites represented</div><div class="value">${sites}</div></div>
    <div class="stat"><div class="label">Top category</div><div class="value small">${topCat || '—'}</div></div>
  `;
}

function topOf(arr) {
  if (!arr.length) return null;
  const counts = {};
  arr.forEach(v => counts[v] = (counts[v]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!entries.length) { wrap.innerHTML = '<div class="empty">No entries yet. Log one above or import a CSV.</div>'; return; }
  const rows = entries.slice().reverse().map((e, i) => {
    const realIdx = entries.length - 1 - i;
    return `<tr>
      <td>${escapeHtml(e.date)}</td>
      <td>${escapeHtml(e.site)}</td>
      <td>${escapeHtml(e.order)}</td>
      <td>${escapeHtml(e.corrected||'')}</td>
      <td>${escapeHtml(e.dept||'')}</td>
      <td>${escapeHtml(e.category)}</td>
      <td class="${e.charge==='Yes'?'yes':e.charge==='Unknown'?'unk':'no'}">${escapeHtml(e.charge)}</td>
      <td>${escapeHtml(e.cause)}${e.causeDetail ? ' — ' + escapeHtml(e.causeDetail) : ''}</td>
      <td>${escapeHtml(e.time||'')}</td>
      <td>${escapeHtml(e.notes||'')}</td>
      <td><button class="del" onclick="deleteEntry(${realIdx})">delete</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>
    <tr><th>Date</th><th>Site</th><th>Order placed</th><th>Corrected to</th><th>Dept</th><th>Category</th><th>Charge</th><th>Root cause</th><th>Time</th><th>Notes</th><th></th></tr>
    ${rows}
  </table>`;
}

let chartCat, chartSite, chartCharge, chartCause, chartPairs, chartTrend;
function renderCharts() {
  const catCounts = {};
  const siteCounts = {};
  const chargeCounts = { Yes: 0, No: 0, Unknown: 0 };
  const causeCounts = {};
  const pairCounts = {};
  const weekCounts = {};

  entries.forEach(e => {
    catCounts[e.category] = (catCounts[e.category]||0)+1;
    siteCounts[e.site] = (siteCounts[e.site]||0)+1;
    if (chargeCounts[e.charge] !== undefined) chargeCounts[e.charge]++;
    causeCounts[e.cause] = (causeCounts[e.cause]||0)+1;
    if (e.order && e.corrected) {
      const key = `${e.order} → ${e.corrected}`;
      pairCounts[key] = (pairCounts[key]||0)+1;
    }
    if (e.date) {
      const d = new Date(e.date + 'T00:00:00');
      if (!isNaN(d)) {
        const monday = new Date(d);
        monday.setDate(d.getDate() - ((d.getDay()+6)%7));
        const wk = monday.toISOString().slice(0,10);
        weekCounts[wk] = (weekCounts[wk]||0)+1;
      }
    }
  });

  const catLabels = Object.keys(catCounts);
  const siteLabels = Object.keys(siteCounts);
  const causeLabels = Object.keys(causeCounts);
  const weekLabels = Object.keys(weekCounts).sort();
  const pairEntries = Object.entries(pairCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  [chartCat, chartSite, chartCharge, chartCause, chartPairs, chartTrend].forEach(c => c && c.destroy());

  const tickColor = '#8b96ac', gridColor = '#232d40', textColor = '#e8ecf3';
  const fontOpts = { family: 'Inter' };

  chartCat = new Chart(document.getElementById('chartCategory'), {
    type: 'bar',
    data: { labels: catLabels, datasets: [{ label: 'Count', data: catLabels.map(l=>catCounts[l]), backgroundColor: '#2dd4bf', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: 'By category', color: textColor, font: {size: 12, ...fontOpts} } },
      scales: { x: { ticks: { color: tickColor, font:{size:10} }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, stepSize:1 }, grid: { color: gridColor } } } }
  });

  chartSite = new Chart(document.getElementById('chartSite'), {
    type: 'bar',
    data: { labels: siteLabels, datasets: [{ label: 'Count', data: siteLabels.map(l=>siteCounts[l]), backgroundColor: '#f5a623', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: 'By site', color: textColor, font: {size: 12, ...fontOpts} } },
      scales: { x: { ticks: { color: tickColor, font:{size:10} }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, stepSize:1 }, grid: { color: gridColor } } } }
  });

  chartCharge = new Chart(document.getElementById('chartCharge'), {
    type: 'doughnut',
    data: { labels: ['Yes','No','Unknown'], datasets: [{ data: [chargeCounts.Yes, chargeCounts.No, chargeCounts.Unknown], backgroundColor: ['#f0574a','#3a4256','#f5a623'], borderColor: '#121826', borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: {
      legend: { position: 'bottom', labels: { color: tickColor, font: {size: 11, ...fontOpts}, boxWidth: 10, padding: 12 } },
      title: { display: true, text: 'By charge impact', color: textColor, font: {size: 12, ...fontOpts} } } }
  });

  chartCause = new Chart(document.getElementById('chartCause'), {
    type: 'bar',
    data: { labels: causeLabels, datasets: [{ label: 'Count', data: causeLabels.map(l=>causeCounts[l]), backgroundColor: '#4a90d9', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: 'By root cause', color: textColor, font: {size: 12, ...fontOpts} } },
      scales: { x: { ticks: { color: tickColor, font:{size:10} }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, stepSize:1 }, grid: { color: gridColor } } } }
  });

  const pairsEl = document.getElementById('chartPairs');
  if (!pairEntries.length) {
    pairsEl.getContext('2d').clearRect(0,0,pairsEl.width,pairsEl.height);
  } else {
    chartPairs = new Chart(pairsEl, {
      type: 'bar',
      data: { labels: pairEntries.map(p=>p[0]), datasets: [{ label: 'Count', data: pairEntries.map(p=>p[1]), backgroundColor: '#2dd4bf', borderRadius: 4 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: tickColor, stepSize:1 }, grid: { color: gridColor } }, y: { ticks: { color: textColor, font:{size:11} }, grid: { display: false } } } }
    });
  }

  chartTrend = new Chart(document.getElementById('chartTrend'), {
    type: 'line',
    data: { labels: weekLabels, datasets: [{ label: 'Entries', data: weekLabels.map(w=>weekCounts[w]), borderColor: '#2dd4bf', backgroundColor: 'rgba(45,212,191,0.12)', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#2dd4bf' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: tickColor, font:{size:10} }, grid: { display: false } }, y: { ticks: { color: tickColor, stepSize:1 }, grid: { color: gridColor } } } }
  });
}

function exportCSV() {
  const headers = ['Date','Site','OrderPlaced','CorrectedTo','Department','Category','ChargeImpact','RootCause','RootCauseDetail','ResolutionTimeMin','Notes'];
  const rows = entries.map(e => [e.date,e.site,e.order,e.corrected,e.dept,e.category,e.charge,e.cause,e.causeDetail,e.time,e.notes]
    .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'discrepancy_log.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    if (lines.length < 2) return;
    const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
    for (let i = 1; i < lines.length; i++) {
      const vals = parseCSVLine(lines[i]);
      const obj = {};
      headers.forEach((h, idx) => obj[h] = vals[idx] || '');
      entries.push({
        date: obj.date || '',
        site: obj.site || '',
        order: obj.orderplaced || obj.order || '',
        corrected: obj.correctedto || obj.corrected || '',
        dept: obj.department || obj.dept || '',
        category: obj.category || 'Other',
        charge: obj.chargeimpact || obj.charge || 'No',
        cause: obj.rootcause || obj.cause || 'Other',
        causeDetail: obj.rootcausedetail || obj.causedetail || '',
        time: obj.resolutiontimemin || obj.time || '',
        notes: obj.notes || '',
      });
    }
    saveData();
    render();
    event.target.value = '';
  };
  reader.readAsText(file);
}

function parseCSVLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

if (savedLink) {
